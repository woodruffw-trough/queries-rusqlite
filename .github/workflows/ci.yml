name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.95.0", stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev pkg-config
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo doc --workspace --no-deps --locked
      - name: Check packages
        if: matrix.rust == 'stable'
        run: cargo publish --workspace --locked --dry-run

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev pkg-config
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      - run: cargo install cargo-llvm-cov --locked --version 0.9.1
      - run: >-
          cargo llvm-cov --workspace --all-targets --locked
          --ignore-filename-regex '(/tests/|/src/tests\.rs$)'
          --fail-under-lines 100 --fail-under-functions 100 --fail-under-regions 100
