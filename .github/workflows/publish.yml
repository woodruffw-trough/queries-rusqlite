name: Publish

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: crates-io
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/queries-rusqlite
    permissions:
      contents: read
      id-token: write # Authenticate with crates.io.
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev pkg-config
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Check release versions
        run: |
          cargo metadata --no-deps --format-version 1 --locked |
            jq --exit-status --arg tag "$GITHUB_REF_NAME" \
              '.packages | all("v" + .version == $tag)'
      - name: Check packages
        run: cargo publish --workspace --locked --dry-run
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish workspace
        run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
